<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBook 插件设置</title>
    <link rel="stylesheet" href="common.css">
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <div class="brand-mark">W</div>
        <div>
          <h1>WordBook 插件设置</h1>
          <p>配置完成后，插件会把生词直接保存到你的服务器</p>
        </div>
      </header>

      <section class="card">
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <form id="settings-form">
          <div class="field">
            <label for="serverUrl">服务器地址</label>
            <input id="serverUrl" name="serverUrl" type="url" placeholder="http://服务器IP:16040" required>
            <span class="hint">填写 WordBook 网页地址，不要添加 /api 路径。</span>
          </div>

          <div class="field">
            <label for="apiToken">扩展访问令牌</label>
            <input id="apiToken" name="apiToken" type="password" autocomplete="off" required>
            <span class="hint">令牌来自服务器的 /etc/WordBook.env，仅保存在当前 Edge 配置中。</span>
          </div>

          <div class="actions">
            <button id="test" class="button secondary" type="button">测试连接</button>
            <button class="button primary" type="submit">保存设置</button>
          </div>
        </form>
      </section>

      <section class="card usage-card">
        <h2>使用方法</h2>
        <ol>
          <li>在 PDF 或网页中选中一个单词。</li>
          <li>按 <span class="shortcut">`</span>，填写释义后保存。</li>
          <li>如果 Edge PDF 阅读器没有响应，右键选中文字并选择“添加到 WordBook”。</li>
        </ol>
        <p>备用快捷键：<span class="shortcut">Alt</span> + <span class="shortcut">W</span></p>
      </section>
    </main>

    <script src="shared.js"></script>
    <script src="options.js"></script>
  </body>
</html>
